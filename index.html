<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f0"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Mes Repas</title><style>
:root{--bg:#f7f7f0;--paper:#fff;--ink:#20352c;--muted:#65786c;--accent:#25634c;--line:#e1e7df;--warm:#fff1d7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.4}header,main{max-width:760px;margin:auto;padding:20px}header{padding-top:calc(18px + env(safe-area-inset-top));padding-bottom:4px}h1{font-size:30px;letter-spacing:-1.4px;margin:0}h2{font-size:23px;letter-spacing:-.5px;margin:0 0 12px}h3{font-size:18px;margin:0 0 5px}p{margin:7px 0 13px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}.muted,small{color:var(--muted)}main{padding-bottom:calc(110px + env(safe-area-inset-bottom))}.panel,.item{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}.hero{background:#e6efe3;border:none;padding:22px}.row{display:flex;align-items:center;gap:10px;justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:white;padding:12px 8px;border-radius:13px;text-align:center}.stat b{font-size:23px;display:block}.stat small{font-size:12px}button,input,select{font:inherit}button{cursor:pointer;background:var(--accent);color:white;border:0;border-radius:11px;padding:11px 14px;font-weight:650;min-height:44px}button.secondary{background:#edf3ed;color:var(--accent)}button.danger{background:#f9e8e4;color:#9b4235}button.text{background:none;color:var(--accent);padding:7px;min-height:40px}button:disabled{opacity:.45;cursor:default}input,select{width:100%;background:white;border:1px solid #ccd8cd;border-radius:10px;padding:11px;color:var(--ink);min-height:44px;min-width:0}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}form{margin:0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{width:100%;margin-top:12px}.pill{font-size:12px;font-weight:650;background:#e8f1e7;color:#286045;border-radius:20px;padding:5px 9px;display:inline-block}.pill.missing{background:var(--warm);color:#805411}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}.tabs button:not(.active){background:#e9eee7;color:#425749}nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:6px 4px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:4}nav button{background:none;color:var(--muted);padding:6px 2px;flex:1;max-width:140px;font-size:11px;line-height:1.2}nav button.active{color:var(--accent);font-weight:800}nav span{display:block;font-size:22px;margin-bottom:3px}.empty{text-align:center;padding:22px 10px;color:var(--muted)}.check{width:24px;height:24px;accent-color:var(--accent);min-height:0;flex-shrink:0}.done{text-decoration:line-through;color:var(--muted)}.ingredients{padding-left:20px;margin:8px 0}.ingredients li{margin:4px 0}.notice{padding:10px 13px;border-radius:10px;background:#fff1d7;color:#6c502b;font-size:13px}.date{font-weight:700;color:var(--accent);font-size:14px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.actions button{flex:1}.recipe-title{display:flex;gap:10px;align-items:center}.emoji{font-size:31px;background:#f0f3e9;width:53px;height:53px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}details summary{cursor:pointer;font-weight:650;color:var(--accent);padding:8px 0}#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#20352c;color:white;padding:12px 18px;border-radius:12px;z-index:8;max-width:90%;box-shadow:0 3px 15px #0002}a{color:var(--accent)}@media(max-width:350px){header,main{padding-left:12px;padding-right:12px}.stats small{font-size:11px}}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:12px 0}.calendar-grid>small{text-align:center;font-size:11px}.calendar-grid .day{min-width:0;padding:4px 0;min-height:45px;background:#f0f4ed;color:var(--ink);font-weight:600;border:1px solid transparent}.calendar-grid .today{border-color:var(--accent)}.calendar-grid .selected{background:var(--accent);color:white}.dots{display:flex;justify-content:center;gap:4px;height:7px;margin-top:2px}.dots i{width:5px;height:5px;border-radius:50%;border:1px solid currentColor;opacity:.22}.dots i.filled{background:currentColor;opacity:1}.month-label,.selected-label{text-transform:capitalize}.selected-label{margin:18px 0 8px}.calendar .row button{min-width:44px}.calendar{padding:12px}</style></head><body><header><div class="eyebrow">Cuisine du quotidien</div><h1>Mes Repas</h1></header><main id="main"></main><nav id="nav" aria-label="Navigation"></nav><div id="toast" role="status" hidden></div><script src="recipes.js"></script><script src="app.js"></script></body></html>
